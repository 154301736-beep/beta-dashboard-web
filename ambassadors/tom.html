const data=JSON.parse(document.getElementById('encrypted').textContent);const bytes=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));document.getElementById('unlock').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('button'),message=document.getElementById('message');button.disabled=true;message.textContent='正在解锁…';try{if(!crypto.subtle||!window.DecompressionStream)throw Error('unsupported');const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(data.salt),iterations:data.iterations,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);const zipped=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(data.iv)},key,bytes(data.ciphertext));const html=await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();}catch(error){message.textContent=error.message==='unsupported'?'请使用新版 Chrome、Edge 或 Safari 浏览器。':'密码不正确，请重新输入。';button.disabled=false;}};
